name: 🚀 Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v4

      - name: 🔐 Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            git config --global --add safe.directory /var/www/html/zoikotelecom-reactNextTypeTail
            cd /var/www/html/zoikotelecom-reactNextTypeTail
            git fetch origin
            git reset --hard origin/main
            npm install
            npm run build
            pm2 restart zoikotelecom
            echo "✅ Deployment complete!"