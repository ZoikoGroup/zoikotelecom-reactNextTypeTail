name: Deploy to GCP VM

on:
  push:
    branches: [ main ]

# Never run two deploys on the VM at the same time: queue them instead.
# (Overlapping runs fight over node_modules and the .next build lock.)
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USER }}
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            # Stop on the first failing command so a broken install/build never gets restarted
            set -e
            cd ${{ secrets.GCP_APP_PATH }}
            git pull origin main

            # A stale/partially-written node_modules makes `npm ci` fail with ENOTEMPTY.
            # Remove it first (sudo fallback in case files were created by root).
            rm -rf node_modules || sudo rm -rf node_modules
            npm ci --no-audit --no-fund

            # Stop any leftover `next build` in THIS app folder (e.g. from a deploy whose
            # SSH session timed out). It holds .next/lock and blocks the new build.
            APP_DIR="$(pwd -P)"
            for pid in $(pgrep -f "next build" || true); do
              if [ "$(sudo readlink -f /proc/$pid/cwd 2>/dev/null)" = "$APP_DIR" ]; then
                echo "Stopping stale next build (pid $pid)"
                sudo kill "$pid" 2>/dev/null || true
              fi
            done
            sleep 3
            rm -f .next/lock 2>/dev/null || sudo rm -f .next/lock

            npm run build

            # Restart the app, or register it with PM2 if the process does not exist yet
            if sudo pm2 describe zoikotelecom > /dev/null 2>&1; then
              sudo pm2 restart zoikotelecom --update-env
            else
              sudo pm2 start npm --name zoikotelecom -- start
            fi
            sudo pm2 save

      - name: Purge Cloudflare cache
        run: |
          curl -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CF_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
